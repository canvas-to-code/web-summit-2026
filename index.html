function getTrackLabel(track) {
  return TRACK_LABELS[track] || track;

function parseSpeakerLabel(speakerLabel) {
  const match = speakerLabel.match(/^(.*?)\s*\((.*)\)$/);
  if (!match) {
    return { name: speakerLabel.trim(), details: "" };
  }

  return {
    name: match[1].trim(),
    details: match[2].trim(),
  };
}

const ALL_SESSION_SPEAKERS = Array.from(
  Object.values(SESSIONS)
    .flat()
    .flatMap((session) => session.speakers || [])
    .reduce((map, speakerLabel) => {
      const parsedSpeaker = parseSpeakerLabel(speakerLabel);
      const existingSpeaker = map.get(parsedSpeaker.name);

      if (!existingSpeaker || parsedSpeaker.details.length > existingSpeaker.details.length) {
        map.set(parsedSpeaker.name, parsedSpeaker);
      }

      return map;
    }, new Map())
    .values()
).sort((a, b) => a.name.localeCompare(b.name));

function getSessionCardTheme(session) {
  const trackColor = TRACK_COLORS[session.track] || TRACK_COLORS["Centre Stage"];
  const accent = session.accentOverride ?? trackColor.accent;
  const cardEdgeColor = "#ffffff26";
  return {
    accent,
    cardBackground: SCHEDULE_CARD_BG,
    cardEdgeColor,
  };

function accentWithAlpha(hex, alpha) {
  if (!hex || hex[0] !== "#" || hex.length !== 7) return hex;
  const a = Math.round(alpha * 255)
    .toString(16)
    .padStart(2, "0");
  return `${hex}${a}`;
}

const VALID_APP_TABS = ["summary", "highlights", "schedule", "speakers", "tracks"];

function sessionSlug(title) {
  return title
    .toLowerCase()
    .replace(/['']/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function findSessionBySlug(slug) {
  if (!slug) return null;
  for (const day of DAYS) {
    for (const session of SESSIONS[day.id] || []) {
      if (sessionSlug(session.title) === slug) {
        return { session, dayId: day.id };
      }
    }
  }
  return null;
}

  const trackParam = params.get("track");
  const track =
    trackParam && FOCUS_TRACKS.some((t) => t.name === trackParam)
      ? trackParam
      : FOCUS_TRACKS[0].name;
  const modal = findSessionBySlug(params.get("session"));
  return {
    tab: VALID_APP_TABS.includes(tab) ? tab : "summary",
    track,
    modal,
  };
}

function buildAppSearch({ tab, track, modal }) {
  const params = new URLSearchParams();
  params.set("tab", tab);
  if (tab === "schedule") {
    params.set("track", track);
    if (modal?.session) {
      params.set("session", sessionSlug(modal.session.title));
    }
  }
  return `?${params.toString()}`;
}

/** `depth` counts in-app history entries; 0 is the entry the visitor landed on. */
function toHistoryState({ tab, track, modal }, depth) {
  return {
    tab,
    track,
    session: modal?.session ? sessionSlug(modal.session.title) : null,
    depth,
  };
}

function fromHistoryState(state) {
  if (!state || typeof state.tab !== "string") {
    return parseAppRoute();
  }
  const track =
    state.track && FOCUS_TRACKS.some((t) => t.name === state.track)
      ? state.track
      : FOCUS_TRACKS[0].name;
  const modal = state.session ? findSessionBySlug(state.session) : null;
  return {
    tab: VALID_APP_TABS.includes(state.tab) ? state.tab : "summary",
    track,
    modal,
  };
}

function WebSummitGuide() {
  const initialRoute = parseAppRoute();
  const historySyncRef = useRef(false);
  const historyInitRef = useRef(true);
  const [activeTrack, setActiveTrack] = useState(initialRoute.track);
  const [activeTab, setActiveTab] = useState(initialRoute.tab);
  const [scheduleModal, setScheduleModal] = useState(
    initialRoute.tab === "schedule" ? initialRoute.modal : null
  );

  const scheduleSessions = DAYS.flatMap((day) =>
    (SESSIONS[day.id] || [])
      .filter((session) => session.track === activeTrack)
      .map((session, index) => ({
        session,
        dayId: day.id,
        dayLabel: day.label,
        index,
      }))
  );

  function applyRoute(route) {
    setActiveTab(route.tab);
    setActiveTrack(route.track);
    setScheduleModal(route.tab === "schedule" ? route.modal : null);
  }

  useEffect(() => {
    const route = {
      tab: activeTab,
      track: activeTrack,
      modal: scheduleModal,
    };
    window.history.replaceState(
      toHistoryState(route, window.history.state?.depth ?? 0),
      "",
      `${window.location.pathname}${buildAppSearch(route)}`
    );

    function onPopState(event) {
      historySyncRef.current = true;
      applyRoute(fromHistoryState(event.state));
      historySyncRef.current = false;
    }

    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, []);

  useEffect(() => {
    if (historyInitRef.current) {
      historyInitRef.current = false;
      return;
    }
    if (historySyncRef.current) return;
    const route = {
      tab: activeTab,
      track: activeTrack,
      modal: scheduleModal,
    };
    const search = buildAppSearch(route);
    if (search === window.location.search) return;
    window.history.pushState(
      toHistoryState(route, (window.history.state?.depth ?? 0) + 1),
      "",
      `${window.location.pathname}${search}`
    );

                  onClick={() => setActiveTrack(track.name)}
                  style={{
                    width: "100%",
                    padding: "14px 20px",
                    background: tabBackground,
                    border: isActive ? "1px solid #7c6fff55" : "1px solid #ffffff10",
                    borderRadius: "12px",
                    color: isActive ? "#e8e8ff" : "#888",
                    cursor: "pointer",
                    fontFamily: "inherit",
                    textAlign: "center",
                    transition: "background 0.2s",
                  }}
                  onMouseEnter={(e) => {
                    e.currentTarget.style.background = tabBackgroundHover;
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.background = tabBackground;
                  }}
                >
                  <div style={{ fontSize: "14.0625px", fontWeight: 600 }}>{getTrackLabel(track.name)}</div>
                </button>
                );
              })}
            </div>

            {/* Sessions List */}
            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
              {scheduleSessions.map(({ session, dayId, dayLabel, index }) => {
                const { accent, cardBackground } = getSessionCardTheme(session);
                return (
                  <div
                    key={`${dayId}-${session.title}-${session.time}-${index}`}
                    role="button"
                    tabIndex={0}
                    onClick={() => openScheduleModal(session, dayId)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        openScheduleModal(session, dayId);
                      }
                    }}
                    className="cursor-pointer rounded-[10px] transition-colors duration-200"
                    style={{
                      backgroundColor: cardBackground,
                      backgroundImage: `linear-gradient(90deg, ${accent} 0, ${accent} 3px, transparent 3px)`,
                      backgroundRepeat: "no-repeat",
                      padding: "12px 14px",
                      borderTop: `1px solid ${SCHEDULE_CARD_HAIRLINE}`,
                      borderRight: `1px solid ${SCHEDULE_CARD_HAIRLINE}`,
                      borderBottom: `1px solid ${SCHEDULE_CARD_HAIRLINE}`,
                      borderLeft: "none",
                    }}
                    onMouseEnter={(e) => {
                      e.currentTarget.style.backgroundColor = SCHEDULE_CARD_BG_HOVER;
                    }}
                    onMouseLeave={(e) => {
                      e.currentTarget.style.backgroundColor = cardBackground;
                    }}
                  >
                    <div style={{
                      marginBottom: "8px",
                    }}>
                      <span style={{
                        fontFamily: "'Space Mono', monospace",
                        fontSize: "13.75px",
                        color: accent,
                        fontWeight: 700,
                      }}>
                        {dayLabel}, {session.time}
                      </span>
                    </div>

                    <h3 style={{
                      fontSize: "18.75px",
                      fontWeight: 600,
                      margin: "0 0 6px",
                      color: "#f0f0ff",
                      lineHeight: 1.3,
                    }}>
                      {session.title}
                    </h3>

                    <div style={{
                      fontSize: "13.75px",
                      color: accent,
                      fontWeight: 500,
                      marginBottom: "6px",
                      opacity: 0.8,
                    }}>
                      {getTrackLabel(session.track)}{session.location ? ` · ${session.location}` : ""}
                    </div>

                    {session.speakers.length > 0 && (
                      <div style={{ fontSize: "15px", color: "#999", marginBottom: "8px" }}>
                        {session.speakers.join(" · ")}
                      </div>
                    )}

                    {session.tags && (
                      <div style={{ display: "flex", gap: "4px", flexWrap: "wrap", marginBottom: "8px" }}>
                        {session.tags.map(t => <TagPill key={t} tag={t} fontSize="12.5px" />)}
                      </div>
                    )}

                    {session.note ? (
                      <p style={{
                        fontSize: "15px",
                        color: "#7a7a8e",
                        margin: 0,
                        lineHeight: 1.5,
                        fontStyle: "italic",
                      }}>
                        {session.note}
                      </p>
                    ) : null}
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* TRACKS TAB */}
        {activeTab === "tracks" && (
          <div>
            <h2 style={{ fontSize: "18px", fontWeight: 600, margin: "8px 0 4px", color: "#e8e8ff" }}>
              Your Priority Tracks
            </h2>
            <p style={{ fontSize: "13px", color: "#666", margin: "0 0 20px" }}>
              Ranked by relevance to product design, UX/UI, AI, and brand development
            </p>

            <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
              {PRIORITY_TRACKS.map((track, i) => {
                const trackColorKey =
                  track.name === "Corporate Innovation Summit"
                    ? "Corporate Innovation"
                    : track.name;
                const tc = TRACK_COLORS[trackColorKey] || TRACK_COLORS["Centre Stage"];
                const priorityTrackScheduleHighlightBg =
                  track.name === "Corporate Innovation Summit" ||
                  track.name === "Growth Summit" ||
                  track.name === "Broad Topics";
                const priorityTrackCardBg = priorityTrackScheduleHighlightBg
                  ? `linear-gradient(135deg, ${tc.bg}, #0a0a1299)`
                  : `linear-gradient(135deg, ${tc.bg}, #0a0a12)`;
                return (
                  <div key={i} style={{
                    background: priorityTrackCardBg,
                    border: `1px solid ${tc.accent}33`,
                    borderRadius: "14px",
                    padding: "18px",
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "10px" }}>
                      <span style={{
                        width: "28px",
                        height: "28px",
                        borderRadius: "8px",
                        background: `${tc.accent}22`,
                        border: `1px solid ${tc.accent}44`,
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        fontSize: "13px",
                        fontWeight: 700,
                        color: tc.accent,
                        fontFamily: "'Space Mono', monospace",
                      }}>
                        {i + 1}
                      </span>
                      <h3 style={{ fontSize: "16px", fontWeight: 600, margin: 0, color: tc.accent }}>
                        {getTrackLabel(track.name)}
                      </h3>
                    </div>
                    <p style={{ fontSize: "13px", color: "#bbb", margin: "0 0 12px", lineHeight: 1.5 }}>
                      {track.why}
                    </p>
                    <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                      {track.companies.map(c => (
                        <span key={c} style={{
                          background: "#ffffff0a",
                          border: "1px solid #ffffff15",
                          padding: "3px 10px",
                          borderRadius: "8px",
                          fontSize: "11px",
                          color: "#999",
                        }}>
                          {c}
                        </span>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* SPEAKERS TAB */}
        {activeTab === "speakers" && (
          <div>
            <h2 style={{ fontSize: "18px", fontWeight: 600, margin: "8px 0 4px", color: "#e8e8ff" }}>
              Session Speakers
            </h2>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                gap: "14px",
                marginBottom: "20px",
              }}
            >
              {SPEAKER_PAGE_IMAGES.map((speaker, index) => (
                <div
                  key={speaker.src}
                  style={{
                    width: "108px",
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    textAlign: "center",
                    gap: "8px",
                  }}
                >
                  <div
                    style={{
                      width: "88px",
                      height: "88px",
                      borderRadius: "50%",
                      padding: "3px",
                      background: "linear-gradient(135deg, #7c6fff66, #c77dff55)",
                      boxShadow: "0 0 0 1px #ffffff10",
                      flexShrink: 0,
                    }}
                  >
                    <img
                      src={speaker.src}
                      alt={`${speaker.name} portrait`}
                      style={{
                        display: "block",
                        width: "100%",
                        height: "100%",
                        borderRadius: "50%",
                        objectFit: "cover",
                        background: "#151520",
                      }}
                    />
                  </div>
                  <div>
                    <div style={{ fontSize: "12px", fontWeight: 600, color: "#e8e8ff", lineHeight: 1.35 }}>
                      {speaker.name}
                    </div>
                    <div style={{ fontSize: "11px", color: "#888", marginTop: "2px", lineHeight: 1.35 }}>
                      {speaker.title}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              {ALL_SESSION_SPEAKERS.map((speaker) => (
                <div key={speaker.name} style={{
                  background: "#ffffff06",
                  border: "1px solid #ffffff0a",
                  borderRadius: "12px",
                  padding: "14px 16px",
                  display: "flex",
                  gap: "14px",
                  alignItems: "center",
                }}>
                  <div style={{
                    width: "36px",
                    height: "36px",
                    borderRadius: "10px",
                    background: "linear-gradient(135deg, #7c6fff22, #c77dff22)",
                    border: "1px solid #7c6fff33",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    fontSize: "14px",
                    flexShrink: 0,
                  }}>
                    {speaker.name.charAt(0)}
                  </div>
                  <div>
                    <div style={{ fontSize: "14px", fontWeight: 600, color: "#e8e8ff" }}>
                      {speaker.name}
                    </div>
                    <div style={{ fontSize: "12px", color: "#888", marginTop: "2px" }}>
                      {speaker.details || "Speaker details documented in session notes"}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {scheduleModal && (
        <SessionModal
          session={scheduleModal.session}
          openedFromDayId={scheduleModal.dayId}
          onClose={closeScheduleModal}
        />
      )}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<WebSummitGuide />);
  </script>
</body>
</html>
